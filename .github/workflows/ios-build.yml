name: iOS Build and Test

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'ios/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    strategy:
      matrix:
        xcode-version: ['15.0']
        ios-version: ['17.0']
    
    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Set up Xcode
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode-version }}

      # 3. Set up Ruby (for CocoaPods)
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.0
          bundler-cache: true

      # 4. Install CocoaPods dependencies
      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install --repo-update
        env:
          COCOAPODS_DISABLE_STATS: true

      # 5. Install development certificates and provisioning profile
      - name: Import Code Signing Certificate
        uses: apple-actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.CODE_SIGNING_CERTIFICATE }}
          p12-password: ${{ secrets.CODE_SIGNING_PASSWORD }}

      - name: Install Provisioning Profile
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo ${{ secrets.PROVISIONING_PROFILE_BASE64 }} | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision
        if: ${{ secrets.PROVISIONING_PROFILE_BASE64 != '' }}

      # 6. Create build settings file
      - name: Create BuildSettings
        run: |
          cd ios
          cat > BuildSettings.xcconfig << EOF
          DEVELOPMENT_TEAM = ${{ secrets.DEVELOPMENT_TEAM_ID }}
          PROVISIONING_PROFILE = profile
          CODE_SIGN_IDENTITY = Apple Distribution
          EOF
        if: ${{ secrets.DEVELOPMENT_TEAM_ID != '' }}

      # 7. Run unit tests
      - name: Run Unit Tests
        run: |
          cd ios
          xcodebuild test \
            -workspace NFCTagApp.xcworkspace \
            -scheme NFCTagApp \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator,name=iPhone 15' \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult \
            | xcpretty --color --report html \
            --output report.html

      # 8. Upload test results
      - name: Upload Test Results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: test-results-${{ matrix.ios-version }}
          path: |
            ios/TestResults.xcresult
            ios/report.html

      # 9. Build iOS app for simulator
      - name: Build iOS App (Simulator)
        run: |
          cd ios
          xcodebuild build \
            -workspace NFCTagApp.xcworkspace \
            -scheme NFCTagApp \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator,name=iPhone 15' \
            -derivedDataPath build \
            | xcpretty --color

      # 10. Build iOS app for device (archive)
      - name: Build iOS App (Device Archive)
        run: |
          cd ios
          xcodebuild archive \
            -workspace NFCTagApp.xcworkspace \
            -scheme NFCTagApp \
            -configuration Release \
            -archivePath build/NFCTagApp.xcarchive \
            -derivedDataPath build \
            | xcpretty --color
        if: ${{ secrets.DEVELOPMENT_TEAM_ID != '' }}

      # 11. Export IPA for distribution
      - name: Export IPA
        run: |
          cd ios
          xcodebuild -exportArchive \
            -archivePath build/NFCTagApp.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/ipa
        if: ${{ secrets.DEVELOPMENT_TEAM_ID != '' }}

      # 12. Upload build artifacts
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: ios-build-${{ matrix.ios-version }}
          path: |
            ios/build/NFCTagApp.xcarchive
            ios/build/ipa/*.ipa
          retention-days: 7

      # 13. Upload code coverage
      - name: Upload Code Coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./ios/TestResults.xcresult/SessionLogs/*/CoverageLogs/Coverage.json
          flags: ios
          name: iOS Code Coverage

      # 14. Report build status
      - name: Report Build Status
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ iOS build succeeded"
          else
            echo "❌ iOS build failed"
          fi

      # 15. Comment on PR with results
      - name: Comment on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ job.status }}' === 'success' ? '✅ Passed' : '❌ Failed';
            const iosVersion = '${{ matrix.ios-version }}';
            const xcodeVersion = '${{ matrix.xcode-version }}';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## iOS Build Report
              
              **Status:** ${status}
              **Xcode Version:** ${xcodeVersion}
              **iOS Version:** ${iosVersion}
              
              - [Build Artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
              - [Test Results](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
              
              Build triggered by: ${{ github.event_name }}
              `
            })

  analyze-code-coverage:
    needs: build
    runs-on: macos-latest
    if: always()
    
    steps:
      - name: Download coverage reports
        uses: actions/download-artifact@v3
        
      - name: Generate coverage summary
        run: |
          echo "## Code Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "test-results-17.0/TestResults.xcresult" ]; then
            echo "✅ Coverage data available" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ No coverage data available" >> $GITHUB_STEP_SUMMARY
          fi

  lint-and-analyze:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run SwiftLint
        run: |
          cd ios
          if command -v swiftlint &> /dev/null; then
            swiftlint --strict
          else
            echo "SwiftLint not installed. Skipping code style checks."
          fi
        continue-on-error: true

      - name: Analyze with Xcode
        run: |
          cd ios
          xcodebuild analyze \
            -workspace NFCTagApp.xcworkspace \
            -scheme NFCTagApp \
            -configuration Debug \
            | xcpretty --color
        continue-on-error: true

  notify-on-failure:
    needs: [build, lint-and-analyze]
    runs-on: ubuntu-latest
    if: failure()
    
    steps:
      - name: Create issue for build failure
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `iOS Build Failed - Run #${{ github.run_number }}`,
              body: `The iOS build failed in workflow run #${{ github.run_number }}.
              
              **Details:**
              - Workflow: ${{ github.workflow }}
              - Branch: ${{ github.ref }}
              - Commit: ${{ github.sha }}
              - Author: @${{ github.actor }}
              
              [View Run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
              `,
              labels: ['bug', 'ci-failure']
            })
        if: ${{ github.ref == 'refs/heads/main' }}

  notify-on-success:
    needs: build
    runs-on: ubuntu-latest
    if: success()
    
    steps:
      - name: Log success
        run: |
          echo "✅ iOS build and test completed successfully"
          echo "Build artifacts are available in the workflow run"
