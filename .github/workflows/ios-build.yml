name: iOS Build and Test

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'ios/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    strategy:
      matrix:
        xcode-version: ['15.0']
        ios-version: ['17.0']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode-version }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.0
          bundler-cache: true

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install --repo-update
        env:
          COCOAPODS_DISABLE_STATS: true

      - name: Import Code Signing Certificate
        uses: apple-actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.CODE_SIGNING_CERTIFICATE }}
          p12-password: ${{ secrets.CODE_SIGNING_PASSWORD }}
        continue-on-error: true

      - name: Install Provisioning Profile
        run: |
          if [ -n "${{ secrets.PROVISIONING_PROFILE_BASE64 }}" ]; then
            mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
            echo ${{ secrets.PROVISIONING_PROFILE_BASE64 }} | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision
          fi
        continue-on-error: true

      - name: Run Unit Tests
        run: |
          cd ios
          xcodebuild test \
            -workspace NFCTagApp.xcworkspace \
            -scheme NFCTagApp \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator,name=iPhone 15' \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult
        continue-on-error: true

      - name: Upload Test Results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: test-results-${{ matrix.ios-version }}
          path: ios/TestResults.xcresult
          retention-days: 7

      - name: Build iOS App (Simulator)
        run: |
          cd ios
          xcodebuild build \
            -workspace NFCTagApp.xcworkspace \
            -scheme NFCTagApp \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator,name=iPhone 15' \
            -derivedDataPath build
        continue-on-error: true

      - name: Build iOS App (Device Archive)
        run: |
          cd ios
          xcodebuild archive \
            -workspace NFCTagApp.xcworkspace \
            -scheme NFCTagApp \
            -configuration Release \
            -archivePath build/NFCTagApp.xcarchive \
            -derivedDataPath build
        continue-on-error: true

      - name: Export IPA
        run: |
          cd ios
          if [ -f build/NFCTagApp.xcarchive/Info.plist ]; then
            xcodebuild -exportArchive \
              -archivePath build/NFCTagApp.xcarchive \
              -exportOptionsPlist ExportOptions.plist \
              -exportPath build/ipa
          fi
        continue-on-error: true

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: ios-build-${{ matrix.ios-version }}
          path: ios/build
          retention-days: 7

  lint-and-analyze:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run SwiftLint
        run: |
          cd ios
          if command -v swiftlint &> /dev/null; then
            swiftlint --strict
          else
            echo "SwiftLint not installed. Skipping code style checks."
          fi
        continue-on-error: true

      - name: Analyze with Xcode
        run: |
          cd ios
          xcodebuild analyze \
            -workspace NFCTagApp.xcworkspace \
            -scheme NFCTagApp \
            -configuration Debug
        continue-on-error: true

  notify-on-success:
    needs: build
    runs-on: ubuntu-latest
    if: success()
    
    steps:
      - name: Log success
        run: |
          echo "✅ iOS build and test completed successfully"
          echo "Build artifacts are available in the workflow run"
